name: MultiWeb Deploy

on:
  repository_dispatch:
    types:
      - deploy-client

  # Relanzar a mano el despliegue de un cliente desde la pestaña Actions
  workflow_dispatch:
    inputs:
      cliente:
        description: "Repositorio del cliente (p. ej. startdustrunner.com)"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Los despliegues de un mismo cliente van en cola: si dos pushes llegan
    # casi a la vez, uno no puede sobrescribir en R2 los archivos del otro
    # con una versión más antigua.
    concurrency:
      group: deploy-${{ github.event.client_payload.cliente || github.event.inputs.cliente }}
      cancel-in-progress: false

    env:
      CLIENTE: ${{ github.event.client_payload.cliente || github.event.inputs.cliente }}

    steps:

      # ==========================================
      # INFORMACIÓN
      # ==========================================

      - name: Información del despliegue
        run: |
          echo "========================================="
          echo "        DAME MI WEB - DEPLOY"
          echo "========================================="
          echo "Cliente:"
          echo "${{ env.CLIENTE }}"
          echo ""
          echo "Repositorio:"
          echo "${{ github.event.client_payload.repositorio }}"
          echo ""
          echo "Commit:"
          echo "${{ github.event.client_payload.commit }}"
          echo "========================================="


      # ==========================================
      # TOKEN GITHUB APP
      # ==========================================

      - name: Generar token de GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}
          owner: irojo9
          repositories: ${{ env.CLIENTE }}


      # ==========================================
      # COMPROBAR ACCESO
      # ==========================================

      - name: Comprobar acceso al repositorio
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Comprobando acceso a:"
          echo "irojo9/${{ env.CLIENTE }}"

          gh api \
            repos/irojo9/${{ env.CLIENTE }} \
            --jq '.full_name'


      # ==========================================
      # ¿HAY QUE PUBLICAR?
      #
      # Los commits con [skip ci] (p. ej. borradores guardados desde un
      # panel de redacción) no se publican. Un aviso con forzar=true
      # (el panel pidiendo publicar) se publica siempre.
      # ==========================================

      - name: Comprobar si hay que publicar
        id: decidir
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMIT: ${{ github.event.client_payload.commit }}
          FORZAR: ${{ github.event.client_payload.forzar }}
        run: |
          publicar=true
          if [ -n "$COMMIT" ] && [ "$FORZAR" != "true" ]; then
            mensaje=$(gh api "repos/irojo9/${{ env.CLIENTE }}/commits/$COMMIT" --jq '.commit.message' || true)
            if printf '%s' "$mensaje" | grep -qiE '\[(skip ci|ci skip|no ci|skip actions|actions skip)\]'; then
              publicar=false
              echo "El commit lleva [skip ci]: no se publica."
            fi
          fi
          echo "publicar=$publicar" >> "$GITHUB_OUTPUT"


      # ==========================================
      # DESCARGAR REPOSITORIO
      # ==========================================

      - name: Descargar repositorio
        if: steps.decidir.outputs.publicar == 'true'
        uses: actions/checkout@v4
        with:
          repository: irojo9/${{ env.CLIENTE }}
          token: ${{ steps.app-token.outputs.token }}
          path: web


      # ==========================================
      # ¿WEB CON COMPILACIÓN?
      #
      # Si el repositorio tiene package.json con un script «build», se
      # compila y se publica solo la carpeta resultante (dist/ por defecto,
      # o la indicada en "multiweb": { "salida": "…" } del package.json).
      # El resto de webs se publican tal cual, como siempre.
      # ==========================================

      - name: Detectar web con compilación
        id: tipo
        if: steps.decidir.outputs.publicar == 'true'
        run: |
          compilar=false
          salida=dist
          if [ -f web/package.json ]; then
            compilar=$(node -e "const p=require('./web/package.json');process.stdout.write(p.scripts&&p.scripts.build?'true':'false')")
            salida=$(node -e "const p=require('./web/package.json');process.stdout.write((p.multiweb&&p.multiweb.salida)||'dist')")
          fi
          echo "compilar=$compilar" >> "$GITHUB_OUTPUT"
          echo "salida=$salida" >> "$GITHUB_OUTPUT"
          echo "Compilar: $compilar · Carpeta publicada: $salida"

      - name: Preparar Node
        if: steps.tipo.outputs.compilar == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Caché de la compilación
        if: steps.tipo.outputs.compilar == 'true'
        uses: actions/cache@v4
        with:
          path: web/.cache
          key: compilacion-${{ env.CLIENTE }}-${{ github.run_id }}
          restore-keys: compilacion-${{ env.CLIENTE }}-

      - name: Descargar scripts de despliegue
        if: steps.tipo.outputs.compilar == 'true'
        uses: actions/checkout@v4
        with:
          path: multiweb
          sparse-checkout: scripts

      - name: Compilar web
        if: steps.tipo.outputs.compilar == 'true'
        working-directory: web
        run: |
          npm ci
          npm run build


      # ==========================================
      # MOSTRAR ARCHIVOS
      # ==========================================

      - name: Mostrar archivos
        if: steps.decidir.outputs.publicar == 'true'
        run: |
          echo "Archivos encontrados:"
          find web -type f -not -path '*/.git/*'


      # ==========================================
      # INSTALAR WRANGLER
      # ==========================================

      - name: Instalar Wrangler
        if: steps.decidir.outputs.publicar == 'true'
        run: |
          npm install -g wrangler@latest


      # ==========================================
      # SUBIR WEB A R2
      # ==========================================

      - name: Publicar web compilada en Cloudflare R2
        if: steps.tipo.outputs.compilar == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          bash multiweb/scripts/publicar-compilada.sh "$CLIENTE" "web/${{ steps.tipo.outputs.salida }}" web

      - name: Publicar en Cloudflare R2
        if: steps.decidir.outputs.publicar == 'true' && steps.tipo.outputs.compilar != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |

          cd web

          find . \
            -type f \
            -not -path './.git/*' \
            -print0 | while IFS= read -r -d '' file
          do

            key="${file#./}"

            # Tipo de contenido según la extensión (wrangler no lo deduce)
            ext="${file##*.}"
            ext="${ext,,}"

            case "$ext" in
              html|htm)    content_type="text/html; charset=utf-8" ;;
              css)         content_type="text/css; charset=utf-8" ;;
              js|mjs)      content_type="text/javascript; charset=utf-8" ;;
              json|map)    content_type="application/json; charset=utf-8" ;;
              webmanifest) content_type="application/manifest+json; charset=utf-8" ;;
              xml)         content_type="application/xml; charset=utf-8" ;;
              txt|md)      content_type="text/plain; charset=utf-8" ;;
              svg)         content_type="image/svg+xml" ;;
              png)         content_type="image/png" ;;
              jpg|jpeg)    content_type="image/jpeg" ;;
              gif)         content_type="image/gif" ;;
              webp)        content_type="image/webp" ;;
              avif)        content_type="image/avif" ;;
              ico)         content_type="image/x-icon" ;;
              woff2)       content_type="font/woff2" ;;
              woff)        content_type="font/woff" ;;
              ttf)         content_type="font/ttf" ;;
              otf)         content_type="font/otf" ;;
              pdf)         content_type="application/pdf" ;;
              mp4)         content_type="video/mp4" ;;
              webm)        content_type="video/webm" ;;
              *)           content_type="application/octet-stream" ;;
            esac

            echo "Subiendo: $key ($content_type)"

            wrangler r2 object put \
              "clientes-web/${{ env.CLIENTE }}/${key}" \
              --file "$file" \
              --content-type "$content_type" \
              --remote

          done

          cd ..


      # ==========================================
      # CREAR / ACTUALIZAR MAPA DE PREVIEWS
      # ==========================================

      - name: Crear preview-map.json
        if: steps.decidir.outputs.publicar == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |

          echo "========================================="
          echo "       ACTUALIZANDO PREVIEW MAP"
          echo "========================================="

          echo "Cliente:"
          echo "$CLIENTE"

          echo ""

          # ========================================
          # INTENTAR DESCARGAR MAPA EXISTENTE
          # ========================================

          if wrangler r2 object get \
            "clientes-web/preview-map.json" \
            --file preview-map.json \
            --remote
          then

            echo "Mapa existente encontrado."

          else

            echo "No existe mapa. Creando uno nuevo."

            echo "{}" > preview-map.json

          fi


          # ========================================
          # ACTUALIZAR MAPA
          # ========================================

          python3 - <<'PY'
          import json
          import os

          cliente = os.environ["CLIENTE"]

          print("Cliente recibido:")
          print(cliente)

          try:
              with open(
                  "preview-map.json",
                  "r",
                  encoding="utf-8"
              ) as f:
                  data = json.load(f)
          except Exception:
              data = {}

          # El repositorio coincide con el dominio
          # del cliente.

          data[cliente] = cliente

          with open(
              "preview-map.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("")
          print("Mapa actualizado:")
          print(
              json.dumps(
                  data,
                  indent=2,
                  ensure_ascii=False
              )
          )
          PY


          # ========================================
          # MOSTRAR MAPA
          # ========================================

          echo ""
          echo "Contenido final de preview-map.json:"
          cat preview-map.json

          echo ""


          # ========================================
          # SUBIR MAPA A R2
          # ========================================

          echo "Subiendo preview-map.json a R2..."

          wrangler r2 object put \
            "clientes-web/preview-map.json" \
            --file preview-map.json \
            --remote

          echo "Mapa subido correctamente."


      # ==========================================
      # RESULTADO
      # ==========================================

      - name: Resultado
        run: |

          echo ""
          echo "========================================="
          echo "       DESPLIEGUE COMPLETADO"
          echo "========================================="
          echo ""
          echo "Cliente:"
          echo "${{ env.CLIENTE }}"
          echo ""
          echo "Repositorio:"
          echo "irojo9/${{ env.CLIENTE }}"
          echo ""
          echo "R2:"
          echo "clientes-web/${{ env.CLIENTE }}/"
          echo ""
          echo "Preview:"
          echo "https://${{ env.CLIENTE }}.damemiweb.com"
          echo ""
          echo "========================================="
