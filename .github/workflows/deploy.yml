name: MultiWeb Deploy

on:
  repository_dispatch:
    types:
      - deploy-client

  # Relanzar a mano el despliegue de un cliente desde la pestaña Actions
  workflow_dispatch:
    inputs:
      cliente:
        description: "Repositorio del cliente (p. ej. startdustrunner.com)"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Los despliegues de un mismo cliente van en cola: si dos pushes llegan
    # casi a la vez, uno no puede sobrescribir en R2 los archivos del otro
    # con una versión más antigua.
    concurrency:
      group: deploy-${{ github.event.client_payload.cliente || github.event.inputs.cliente }}
      cancel-in-progress: false

    env:
      CLIENTE: ${{ github.event.client_payload.cliente || github.event.inputs.cliente }}

    steps:

      # ==========================================
      # INFORMACIÓN
      # ==========================================

      - name: Información del despliegue
        run: |
          echo "========================================="
          echo "        DAME MI WEB - DEPLOY"
          echo "========================================="
          echo "Cliente:"
          echo "${{ env.CLIENTE }}"
          echo ""
          echo "Repositorio:"
          echo "${{ github.event.client_payload.repositorio }}"
          echo ""
          echo "Commit:"
          echo "${{ github.event.client_payload.commit }}"
          echo "========================================="


      # ==========================================
      # TOKEN GITHUB APP
      # ==========================================

      - name: Generar token de GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}
          owner: irojo9
          repositories: ${{ env.CLIENTE }}


      # ==========================================
      # COMPROBAR ACCESO
      # ==========================================

      - name: Comprobar acceso al repositorio
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Comprobando acceso a:"
          echo "irojo9/${{ env.CLIENTE }}"

          gh api \
            repos/irojo9/${{ env.CLIENTE }} \
            --jq '.full_name'


      # ==========================================
      # ¿HAY QUE PUBLICAR?
      #
      # Los commits con [skip ci] (p. ej. borradores guardados desde un
      # panel de redacción) no se publican. Un aviso con forzar=true
      # (el panel pidiendo publicar) se publica siempre.
      # ==========================================

      - name: Comprobar si hay que publicar
        id: decidir
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMIT: ${{ github.event.client_payload.commit }}
          FORZAR: ${{ github.event.client_payload.forzar }}
        run: |
          publicar=true
          # Este repositorio (el propio sistema de despliegue) no es una web.
          if [ "${CLIENTE,,}" = "multiweb-deploy" ]; then
            publicar=false
            echo "multiweb-deploy no es una web de cliente: no se publica."
          fi
          if [ "$publicar" = true ] && [ -n "$COMMIT" ] && [ "$FORZAR" != "true" ]; then
            mensaje=$(gh api "repos/irojo9/${{ env.CLIENTE }}/commits/$COMMIT" --jq '.commit.message' || true)
            if printf '%s' "$mensaje" | grep -qiE '\[(skip ci|ci skip|no ci|skip actions|actions skip)\]'; then
              publicar=false
              echo "El commit lleva [skip ci]: no se publica."
            fi
          fi
          echo "publicar=$publicar" >> "$GITHUB_OUTPUT"


      # ==========================================
      # DESCARGAR REPOSITORIO
      # ==========================================

      - name: Descargar repositorio
        if: steps.decidir.outputs.publicar == 'true'
        uses: actions/checkout@v4
        with:
          repository: irojo9/${{ env.CLIENTE }}
          token: ${{ steps.app-token.outputs.token }}
          path: web


      # ==========================================
      # ¿WEB CON COMPILACIÓN?
      #
      # Si el repositorio tiene package.json con un script «build», se
      # compila y se publica solo la carpeta resultante (dist/ por defecto,
      # o la indicada en "multiweb": { "salida": "…" } del package.json).
      # El resto de webs se publican tal cual, como siempre.
      # ==========================================

      - name: Detectar web con compilación
        id: tipo
        if: steps.decidir.outputs.publicar == 'true'
        run: |
          compilar=false
          salida=dist
          if [ -f web/package.json ]; then
            compilar=$(node -e "const p=require('./web/package.json');process.stdout.write(p.scripts&&p.scripts.build?'true':'false')")
            salida=$(node -e "const p=require('./web/package.json');process.stdout.write((p.multiweb&&p.multiweb.salida)||'dist')")
          fi
          candado=false
          [ -f web/package-lock.json ] && candado=true
          echo "compilar=$compilar" >> "$GITHUB_OUTPUT"
          echo "salida=$salida" >> "$GITHUB_OUTPUT"
          echo "candado=$candado" >> "$GITHUB_OUTPUT"
          echo "Compilar: $compilar · Carpeta de salida: $salida · package-lock.json: $candado"

      # Con package-lock.json se guarda la caché de npm; sin él no se puede
      # (y antes el despliegue fallaba en este paso).
      - name: Preparar Node (con caché de npm)
        if: steps.tipo.outputs.compilar == 'true' && steps.tipo.outputs.candado == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Preparar Node
        if: steps.decidir.outputs.publicar == 'true' && !(steps.tipo.outputs.compilar == 'true' && steps.tipo.outputs.candado == 'true')
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Caché de la compilación
        if: steps.tipo.outputs.compilar == 'true'
        uses: actions/cache@v4
        with:
          path: web/.cache
          key: compilacion-${{ env.CLIENTE }}-${{ github.run_id }}
          restore-keys: compilacion-${{ env.CLIENTE }}-

      - name: Descargar scripts de despliegue
        if: steps.decidir.outputs.publicar == 'true'
        uses: actions/checkout@v4
        with:
          path: multiweb
          sparse-checkout: scripts

      - name: Compilar web
        if: steps.tipo.outputs.compilar == 'true'
        working-directory: web
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build


      # ==========================================
      # CARPETA A PUBLICAR
      #
      # La carpeta que genera la compilación (dist/ o la indicada en
      # "multiweb": { "salida": "…" }). Si la compilación escribe en la raíz
      # del repositorio (no existe esa carpeta), o la web no se compila, se
      # publica el repositorio.
      # ==========================================

      - name: Carpeta a publicar
        id: carpeta
        if: steps.decidir.outputs.publicar == 'true'
        run: |
          origen=web
          if [ "${{ steps.tipo.outputs.compilar }}" = "true" ] && [ -d "web/${{ steps.tipo.outputs.salida }}" ]; then
            origen="web/${{ steps.tipo.outputs.salida }}"
          fi
          echo "origen=$origen" >> "$GITHUB_OUTPUT"
          echo "Se publica: $origen"


      # ==========================================
      # REVISIÓN PREVIA
      #
      # Avisa (sin detener el despliegue) de lo que le falta a la web:
      # canonical, sitemap, 404, páginas legales, textos de relleno,
      # imágenes pesadas… Los avisos salen en el resumen de la ejecución.
      # ==========================================

      - name: Revisar la web
        if: steps.decidir.outputs.publicar == 'true'
        continue-on-error: true
        run: |
          python3 multiweb/scripts/comprobar-web.py "$CLIENTE" "${{ steps.carpeta.outputs.origen }}"


      # ==========================================
      # INSTALAR WRANGLER
      # ==========================================

      - name: Instalar Wrangler
        if: steps.decidir.outputs.publicar == 'true'
        run: |
          npm install -g wrangler@4


      # ==========================================
      # SUBIR WEB A R2
      #
      # Solo sube lo que ha cambiado y borra lo que ya no existe. No publica
      # documentación ni configuración (README.md, _headers, .htaccess…).
      # La preview cliente.damemiweb.com la resuelve el Worker por la carpeta.
      # ==========================================

      - name: Publicar en Cloudflare R2
        if: steps.decidir.outputs.publicar == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          bash multiweb/scripts/publicar.sh "$CLIENTE" "${{ steps.carpeta.outputs.origen }}" web


      # ==========================================
      # ENLAZAR DOMINIOS AL WORKER
      #
      # dominio.com y www.dominio.com (o los «dominios» de clientes.json).
      # Solo añade lo que falta; si algo lo impide avisa sin fallar.
      # ==========================================

      - name: Enlazar dominios al Worker
        if: steps.decidir.outputs.publicar == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          python3 multiweb/scripts/enlazar-dominios.py "$CLIENTE" multiweb/clientes.json


      # ==========================================
      # RESULTADO
      # ==========================================

      - name: Resultado
        run: |

          echo ""
          echo "========================================="
          echo "       DESPLIEGUE COMPLETADO"
          echo "========================================="
          echo ""
          echo "Cliente:"
          echo "${{ env.CLIENTE }}"
          echo ""
          echo "Repositorio:"
          echo "irojo9/${{ env.CLIENTE }}"
          echo ""
          echo "R2:"
          echo "clientes-web/${{ env.CLIENTE }}/"
          echo ""
          echo "Preview:"
          echo "https://${CLIENTE%.*}.damemiweb.com"
          echo ""
          echo "========================================="
