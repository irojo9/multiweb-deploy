name: MultiWeb Deploy

on:
  workflow_dispatch:
    inputs:
      cliente:
        description: "Nombre del repositorio del cliente"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Generar token de GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}

      - name: Descargar repositorio del cliente
        uses: actions/checkout@v4
        with:
          repository: irojo9/${{ inputs.cliente }}
          token: ${{ steps.app-token.outputs.token }}
          path: web

      - name: Instalar Wrangler
        run: npm install -g wrangler

      - name: Publicar archivos en R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          cd web

          find . -type f \
            -not -path './.git/*' \
            -print0 | while IFS= read -r -d '' file
          do
            key="${file#./}"

            echo "Subiendo: ${key}"

            wrangler r2 object put \
              "clientes-web/${{ inputs.cliente }}/${key}" \
              --file "$file" \
              --remote
          done
