name: MultiWeb Deploy

on:
  repository_dispatch:
    types:
      - deploy-client

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # INFORMACIÓN
      # ==========================================

      - name: Información del despliegue
        run: |
          echo "========================================="
          echo "        DAME MI WEB - DEPLOY"
          echo "========================================="
          echo "Cliente:"
          echo "${{ github.event.client_payload.cliente }}"
          echo ""
          echo "Repositorio:"
          echo "${{ github.event.client_payload.repositorio }}"
          echo ""
          echo "Commit:"
          echo "${{ github.event.client_payload.commit }}"
          echo "========================================="


      # ==========================================
      # TOKEN GITHUB APP
      # ==========================================

      - name: Generar token de GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}
          owner: irojo9
          repositories: ${{ github.event.client_payload.cliente }}


      # ==========================================
      # COMPROBAR REPOSITORIO
      # ==========================================

      - name: Comprobar acceso al repositorio
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Comprobando acceso a:"
          echo "irojo9/${{ github.event.client_payload.cliente }}"

          gh api \
            repos/irojo9/${{ github.event.client_payload.cliente }} \
            --jq '.full_name'


      # ==========================================
      # DESCARGAR WEB
      # ==========================================

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          repository: irojo9/${{ github.event.client_payload.cliente }}
          token: ${{ steps.app-token.outputs.token }}
          path: web


      # ==========================================
      # MOSTRAR ARCHIVOS
      # ==========================================

      - name: Mostrar archivos
        run: |
          echo "Archivos encontrados:"
          find web -type f -not -path '*/.git/*'


      # ==========================================
      # WRANGLER
      # ==========================================

      - name: Instalar Wrangler
        run: |
          npm install -g wrangler@latest


      # ==========================================
      # SUBIR WEB A R2
      # ==========================================

      - name: Publicar en Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |

          cd web

          find . \
            -type f \
            -not -path './.git/*' \
            -print0 | while IFS= read -r -d '' file
          do

            key="${file#./}"

            echo "Subiendo: $key"

            wrangler r2 object put \
              "clientes-web/${{ github.event.client_payload.cliente }}/${key}" \
              --file "$file" \
              --remote

          done

          cd ..


      # ==========================================
      # CREAR MAPA DE PREVIEWS
      # ==========================================

      - name: Crear preview-map.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |

          CLIENTE="${{ github.event.client_payload.cliente }}"

          echo "Cliente detectado:"
          echo "$CLIENTE"

          # Descargar mapa existente si existe
          if wrangler r2 object get \
            "clientes-web/preview-map.json" \
            --file preview-map.json \
            --remote
          then

            echo "Mapa existente encontrado."

          else

            echo "No existe mapa. Creando uno nuevo."

            echo "{}" > preview-map.json

          fi

          # Actualizar el mapa
          python3 - <<'PY'
          import json
          import os

          cliente = os.environ["CLIENTE"]

          try:
              with open("preview-map.json", "r", encoding="utf-8") as f:
                  data = json.load(f)
          except:
              data = {}

          data[cliente] = cliente

          with open("preview-map.json", "w", encoding="utf-8") as f:
              json.dump(
                  data,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("Mapa actualizado:")
          print(json.dumps(data, indent=2, ensure_ascii=False))
          PY

          echo "Subiendo preview-map.json..."

          wrangler r2 object put \
            "clientes-web/preview-map.json" \
            --file preview-map.json \
            --remote


      # ==========================================
      # RESULTADO
      # ==========================================

      - name: Resultado
        run: |

          echo ""
          echo "========================================="
          echo "       DESPLIEGUE COMPLETADO"
          echo "========================================="
          echo ""
          echo "Cliente:"
          echo "${{ github.event.client_payload.cliente }}"
          echo ""
          echo "Repositorio:"
          echo "irojo9/${{ github.event.client_payload.cliente }}"
          echo ""
          echo "R2:"
          echo "clientes-web/${{ github.event.client_payload.cliente }}/"
          echo ""
          echo "Preview:"
          echo "https://${{ github.event.client_payload.cliente }}.damemiweb.com"
          echo ""
          echo "========================================="
