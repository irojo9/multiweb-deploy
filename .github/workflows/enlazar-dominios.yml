name: Enlazar dominios www

# Cada hora enlaza al Worker multi-web el www de todos los dominios de la cuenta
# de Cloudflare que ya llegan al Worker: los que hay y los que se vayan añadiendo.
# Solo añade lo que falta; no borra ni cambia nada.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: enlazar-dominios
  cancel-in-progress: false

jobs:
  enlazar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Enlazar www de todos los dominios
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: python3 scripts/enlazar-dominios.py --todos
